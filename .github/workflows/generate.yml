name: 1 — Generate Posts

on:
  schedule:
    - cron: "0 8 * * *"   # every day 8am UTC = 3am EST
  workflow_dispatch:       # manual trigger anytime

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate:
    name: Generate today's 2 posts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate posts
        env:
          GROQ_API_KEY:              ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_API_KEY:           ${{ secrets.YOUTUBE_API_KEY }}
          TICKETMASTER_API_KEY:      ${{ secrets.TICKETMASTER_API_KEY }}
          TICKETMASTER_AFFILIATE_ID: ${{ secrets.TICKETMASTER_AFFILIATE_ID }}
        run: python generate.py

      - name: Commit posts.json to repo
        run: |
          git config user.name  "Rock Bot"
          git config user.email "bot@mejorrockespanol.com"
          git add posts.json bot_state.json
          git diff --staged --quiet || git commit -m "bot: generated posts $(date -u '+%Y-%m-%d')"
          git push
