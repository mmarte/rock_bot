name: Rock Bot Automation

on:
  schedule:
    # Generate 2 posts for TODAY — runs every day at 08:00 UTC (before morning post)
    - cron: "0 8 * * *"
    # Morning post — every day at 16:00 UTC (11am EST / 10am CST)
    - cron: "0 16 * * *"
    # Evening post — every day at 00:00 UTC (7pm EST / 6pm CST)
    - cron: "0 0 * * *"
    # Make a Reel — every Wednesday at 09:00 UTC
    - cron: "0 9 * * 3"
    # Weekly report — every Sunday at 20:00 UTC
    - cron: "0 20 * * 0"

  # Manual trigger for testing any step
  workflow_dispatch:
    inputs:
      action:
        description: "Which script to run"
        required: true
        default: "generate"
        type: choice
        options:
          - generate
          - publish
          - make_reel
          - report

concurrency:
  group: rock-bot-${{ github.event.schedule || github.run_id }}
  cancel-in-progress: false

jobs:

  # ---------------------------------------------------------------------------
  generate:
    name: Generate today's 2 posts
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 8 * * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'generate')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore queue cache
        uses: actions/cache@v4
        with:
          path: posts.json
          key: posts-${{ github.run_id }}
          restore-keys: posts-

      - name: Run generate.py
        env:
          GROQ_API_KEY:             ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_API_KEY:          ${{ secrets.YOUTUBE_API_KEY }}
          TICKETMASTER_API_KEY:     ${{ secrets.TICKETMASTER_API_KEY }}
          TICKETMASTER_AFFILIATE_ID: ${{ secrets.TICKETMASTER_AFFILIATE_ID }}
        run: python generate.py

      - name: Save queue cache
        uses: actions/cache@v4
        with:
          path: posts.json
          key: posts-${{ github.run_id }}

      - name: Upload posts.json artifact
        uses: actions/upload-artifact@v4
        with:
          name: posts-json-${{ github.run_id }}
          path: posts.json
          retention-days: 14

  # ---------------------------------------------------------------------------
  publish:
    name: Publish next due post
    if: |
      (github.event_name == 'schedule' && (github.event.schedule == '0 16 * * *' || github.event.schedule == '0 0 * * *')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'publish')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore queue cache
        uses: actions/cache@v4
        with:
          path: posts.json
          key: posts-${{ github.run_id }}
          restore-keys: posts-

      - name: Restore log cache
        uses: actions/cache@v4
        with:
          path: log.json
          key: log-${{ github.run_id }}
          restore-keys: log-

      - name: Run publish.py
        env:
          FB_PAGE_ID:     ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN:  ${{ secrets.FB_PAGE_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python publish.py

      - name: Save queue cache
        uses: actions/cache@v4
        with:
          path: posts.json
          key: posts-${{ github.run_id }}

      - name: Save log cache
        uses: actions/cache@v4
        with:
          path: log.json
          key: log-${{ github.run_id }}

  # ---------------------------------------------------------------------------
  make_reel:
    name: Generate weekly Reel (Wednesday 09:00 UTC)
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 9 * * 3') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'make_reel')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (ffmpeg for MoviePy)
        run: sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run make_reel.py
        env:
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          PEXELS_API_KEY:     ${{ secrets.PEXELS_API_KEY }}
        run: python make_reel.py

      - name: Upload Reel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.run_id }}
          path: reels/
          retention-days: 7

  # ---------------------------------------------------------------------------
  report:
    name: Weekly report (Sunday 20:00 UTC)
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 20 * * 0') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'report')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore caches
        uses: actions/cache@v4
        with:
          path: |
            posts.json
            log.json
          key: report-${{ github.run_id }}
          restore-keys: |
            posts-
            log-

      - name: Run report.py
        env:
          REPORT_EMAIL:  ${{ secrets.REPORT_EMAIL }}
          SMTP_USER:     ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python report.py
