name: Rock Bot Automation

on:
  schedule:
    # Generate today's 2 posts — every day at 08:00 UTC
    - cron: "0 8 * * *"
    # Morning post — every day at 16:00 UTC (11am EST)
    - cron: "0 16 * * *"
    # Evening post — every day at 00:00 UTC (7pm EST)
    - cron: "0 0 * * *"
    # Make a Reel — every Wednesday at 09:00 UTC
    - cron: "0 9 * * 3"
    # Weekly report — every Sunday at 20:00 UTC
    - cron: "0 20 * * 0"

  workflow_dispatch:
    inputs:
      action:
        description: "Which script to run"
        required: true
        default: "generate"
        type: choice
        options:
          - generate
          - publish
          - make_reel
          - report

concurrency:
  group: rock-bot
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ── Generate today's 2 posts ──────────────────────────────────────────────
  generate:
    name: Generate today's posts
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 8 * * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'generate')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run generate.py
        env:
          GROQ_API_KEY:              ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_API_KEY:           ${{ secrets.YOUTUBE_API_KEY }}
          TICKETMASTER_API_KEY:      ${{ secrets.TICKETMASTER_API_KEY }}
          TICKETMASTER_AFFILIATE_ID: ${{ secrets.TICKETMASTER_AFFILIATE_ID }}
        run: python generate.py

      - name: Commit posts.json back to repo
        run: |
          git config user.name  "Rock Bot"
          git config user.email "bot@mejorrockespanol.com"
          git add posts.json
          git diff --staged --quiet || git commit -m "bot: generated posts $(date -u '+%Y-%m-%d')"
          git push

  # ── Publish next due post ─────────────────────────────────────────────────
  publish:
    name: Publish post
    if: |
      (github.event_name == 'schedule' && (github.event.schedule == '0 16 * * *' || github.event.schedule == '0 0 * * *')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'publish')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run publish.py
        env:
          FB_PAGE_ID:     ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN:  ${{ secrets.FB_PAGE_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python publish.py

      - name: Commit updated posts.json and log.json
        run: |
          git config user.name  "Rock Bot"
          git config user.email "bot@mejorrockespanol.com"
          git add posts.json log.json
          git diff --staged --quiet || git commit -m "bot: published post $(date -u '+%Y-%m-%d %H:%M')"
          git push

  # ── Make weekly Reel ──────────────────────────────────────────────────────
  make_reel:
    name: Generate Reel
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 9 * * 3') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'make_reel')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run make_reel.py
        env:
          GROQ_API_KEY:    ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY:  ${{ secrets.PEXELS_API_KEY }}
        run: python make_reel.py

      - name: Upload Reel artifact
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.run_id }}
          path: reels/
          retention-days: 7

  # ── Weekly report ─────────────────────────────────────────────────────────
  report:
    name: Weekly report
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 20 * * 0') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'report')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run report.py
        env:
          REPORT_EMAIL:  ${{ secrets.REPORT_EMAIL }}
          SMTP_USER:     ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python report.py
