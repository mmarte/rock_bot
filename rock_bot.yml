name: Rock Bot Automation

on:
  schedule:
    # Generate 7 posts every Sunday at 08:00 UTC
    - cron: "0 8 * * 0"
    # Publish one post every day at 15:00 UTC (11am EST / 10am CST)
    - cron: "0 15 * * *"
    # Send weekly report every Sunday at 08:30 UTC (after generate runs)
    - cron: "30 8 * * 0"

  # Allow manual trigger from GitHub Actions tab (useful for testing)
  workflow_dispatch:
    inputs:
      action:
        description: "Which script to run"
        required: true
        default: "publish"
        type: choice
        options:
          - generate
          - publish
          - report

jobs:
  generate:
    name: Generate weekly posts
    # Only run on Sunday at 08:00 UTC cron, or manual trigger
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 8 * * 0') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'generate')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download current posts.json from artifact cache
        uses: actions/cache@v4
        with:
          path: posts.json
          key: posts-json-${{ github.run_id }}
          restore-keys: posts-json-

      - name: Run generate.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python generate.py

      - name: Upload updated posts.json as artifact
        uses: actions/upload-artifact@v4
        with:
          name: posts-json
          path: posts.json
          retention-days: 30

      - name: Cache posts.json for next job
        uses: actions/cache@v4
        with:
          path: posts.json
          key: posts-json-${{ github.run_id }}

  publish:
    name: Publish daily post
    # Only run on the daily 15:00 UTC cron, or manual trigger
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 15 * * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'publish')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore posts.json from artifact cache
        uses: actions/cache@v4
        with:
          path: posts.json
          key: posts-json-${{ github.run_id }}
          restore-keys: posts-json-

      - name: Restore log.json from artifact cache
        uses: actions/cache@v4
        with:
          path: log.json
          key: log-json-${{ github.run_id }}
          restore-keys: log-json-

      - name: Run publish.py
        env:
          FB_PAGE_ID:    ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python publish.py

      - name: Save updated posts.json to cache
        uses: actions/cache@v4
        with:
          path: posts.json
          key: posts-json-${{ github.run_id }}

      - name: Save updated log.json to cache
        uses: actions/cache@v4
        with:
          path: log.json
          key: log-json-${{ github.run_id }}

  report:
    name: Send weekly report
    # Only run on Sunday at 08:30 UTC cron, or manual trigger
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '30 8 * * 0') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'report')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore posts.json from cache
        uses: actions/cache@v4
        with:
          path: posts.json
          key: posts-json-${{ github.run_id }}
          restore-keys: posts-json-

      - name: Restore log.json from cache
        uses: actions/cache@v4
        with:
          path: log.json
          key: log-json-${{ github.run_id }}
          restore-keys: log-json-

      - name: Run report.py
        env:
          REPORT_EMAIL:  ${{ secrets.REPORT_EMAIL }}
          SMTP_USER:     ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python report.py
